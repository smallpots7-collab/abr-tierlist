<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070910">
<title>A Bizarre Requiem — Stand Tier List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
<header class="hero">
<div>
<p class="eyebrow">Official Stand Index</p>
<h1>A Bizarre Requiem</h1>
<p>Stand-only rarity board. Images are placeholders for now, so the site works immediately without Trello access.</p>
</div>
<div class="legend" aria-label="Rarity legend">
<span class="rarity-common">Common</span>
<span class="rarity-rare">Rare</span>
<span class="rarity-elite">Elite</span>
<span class="rarity-mythic">Mythic</span>
<span class="rarity-special">Special</span>
<span class="rarity-unobtainable">Unobtainable</span>
</div>
</header>

<div id="tierBoard" class="board"></div>
<p class="footer">Replace files inside the images folder later while keeping the same filenames.</p>
</main>

<dialog id="standModal">
<div class="modal">
<button id="closeModal" class="close" type="button" aria-label="Close">×</button>
<div class="modal-image-wrap"><img id="modalImage" alt=""></div>
<div class="modal-content">
<span id="modalRarity" class="rarity-pill"></span>
<h2 id="modalName"></h2>
<p id="modalDescription"></p>
</div>
</div>
</dialog>

<script src="script.js"></script>
</body>
</html>
